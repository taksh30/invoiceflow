[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoiceflow"
version = "0.1.0"
description = "Invoice and receipt auto-processor"
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.2.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",
    "pypdfium2>=4.30.0",
    "pillow>=10.3.0",
    "typer>=0.12.0",
    "tenacity>=8.3.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pandas-stubs>=2.2.0",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
invoiceflow = "invoiceflow.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "pdfplumber",
    "pdfplumber.*",
    "pytesseract",
    "pypdfium2",
    "PIL",
    "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "ocr: tests requiring local tesseract OCR engine",
    "golden: golden benchmark tests against ground truth dataset",
    "integration: end-to-end integration tests",
]
